<!doctype html>
<html lang="en" manifest="offline.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AMINE PS4</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0b0d10;
        --panel: #0e1116;
        --sunk: #11151b;
        --line: #1e2732;
        --fg: #c8ced8;
        --bright: #e6ebf2;
        --dim: #7c8798;
        --faint: #4d5765;
        --ok: #7fd0a0;
        --bad: #d08a7f;
        --warn: #d8c07f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: center;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 14px 18px 30px;
      }
      body.log #state {
        display: block;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 5px;
        background: var(--sunk);
        font: 12px/1.45 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 2px solid #e66;
        background: #2a1414;
        color: #f99;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code { color: #9fb3d0; }
      /* AMINE PS4 V4 boot-card redesign; presentation only. */
      :root {
        --bg:#050811; --panel:#0b1424; --sunk:#07101d; --line:#203b5c;
        --fg:#eaf4ff; --bright:#ffffff; --dim:#93abc8; --faint:#607a9e;
        --ok:#4ce0b3; --bad:#ff6b87; --warn:#ffd27a;
      }
      html,body { background:var(--bg); color:var(--fg); font-family:Arial,system-ui,sans-serif; }
      #brand { position:relative; z-index:2; padding:12px 10px; text-align:center;
        background:#080f1c; border-bottom:1px solid var(--line); box-shadow:none; }
      #brand b { font-size:15px; font-weight:900; letter-spacing:.22em; color:#fff; text-shadow:none; }
      #brand b span { color:#43caff; }
      #ramBox { position:relative; z-index:2; padding:6px 10px; text-align:center;
        background:#070e19; border-bottom:1px solid #172b43; color:#4ce0b3;
        font:11px/1.4 Consolas,monospace; }
      #bootCard { position:fixed; z-index:1; top:50%; left:50%;
        width:min(390px,calc(100vw - 34px)); min-height:280px;
        transform:translate(-50%,-43%); padding:24px 22px 20px;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        border:1px solid #24496e; border-radius:16px;
        background:linear-gradient(145deg,#10233c 0%,#0a1424 62%,#080f1b 100%);
        box-shadow:0 18px 48px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.035); }
      .boot-kicker { color:#8faed0; font-size:9px; font-weight:800; letter-spacing:.16em; text-align:center; }
      .boot-mark { width:64px; height:64px; margin:15px 0 12px; border:1px solid #2d6590;
        border-radius:19px; display:grid; place-items:center; transform:rotate(45deg);
        background:linear-gradient(145deg,#163d60,#0a1a2c); box-shadow:0 0 26px rgba(66,200,255,.12); }
      .boot-core { width:25px; height:25px; display:block; border:3px solid #42c8ff;
        border-right-color:#31d6b0; border-radius:50%; box-shadow:0 0 14px rgba(66,200,255,.35); }
      .boot-title { margin-top:3px; color:#f5f9ff; font-size:22px; font-weight:900; letter-spacing:.19em; }
      .boot-title span { color:#42c8ff; }
      .boot-subtitle { margin-top:8px; color:#8ba7c7; font:700 9px/1.4 Consolas,monospace; letter-spacing:.18em; }
      .boot-track { width:82%; height:4px; margin-top:22px; overflow:hidden; border-radius:8px; background:#1a2c43; }
      .boot-track span { display:block; width:38%; height:100%; border-radius:8px;
        background:linear-gradient(90deg,#42c8ff,#31d6b0); animation:bootload 1.8s ease-in-out infinite; }
      @keyframes bootload { 0%{transform:translateX(-110%)} 100%{transform:translateX(280%)} }
      #spin { position:static; width:22px; height:22px; margin:12px 0 0;
        border:2px solid #203b5c; border-top-color:#42c8ff; border-right-color:#31d6b0;
        border-radius:50%; animation:spin .9s linear infinite; }
      @keyframes spin { to { transform:rotate(360deg); } }
      #msg { position:static; display:block; transform:none; margin-top:9px; padding:0;
        color:#a9c0dc; text-align:center; font-size:11px; font-weight:700; letter-spacing:.04em; }
      body.done #spin, body.fail #spin { display:none; }
      body.done #msg { color:var(--ok); font-size:13px; letter-spacing:.1em; }
      body.fail #msg { color:var(--bad); font-size:12px; }
      body.done .boot-track span { width:100%; animation:none; }
      body.fail .boot-track span { width:100%; background:var(--bad); animation:none; }
      #state,#out { display:none; }
      body.log { display:flex; flex-direction:column; height:100vh; background:#050811; }
      body.log #bootCard { display:none; }
      body.log #wrap { display:flex; flex-direction:column; flex:1; min-height:0; padding:14px 16px 24px; }
      body.log #state { display:block; margin:0 0 8px; color:var(--ok); font-size:18px; font-weight:800; }
      body.log #out { display:block; flex:1; min-height:0; overflow-y:auto; padding:10px 12px;
        border:1px solid var(--line); border-radius:8px; background:#07101d; color:#d8e5ff;
        font:12px/1.45 Consolas,monospace; white-space:pre-wrap; }
      .notice { margin:1em 0; padding:.7em 1em; border:1px solid #7c3347; border-radius:8px;
        background:#24101a; color:#ff9bad; font:700 15px/1.4 Arial,sans-serif; }
      .byline { position:fixed; bottom:8px; left:11px; margin:0; color:var(--faint); font:10px/1 Consolas,monospace; }
      .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } code { color:#8fdcff; }
      @media(max-width:520px) {
        #brand { padding:10px 8px; }
        #bootCard { min-height:260px; padding:20px 15px; transform:translate(-50%,-40%); }
        .boot-title { font-size:19px; }
        .boot-mark { width:56px; height:56px; border-radius:16px; }
      }
      @media(prefers-reduced-motion:reduce) { #spin,.boot-track span { animation:none; } }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>AMINE <span>PS4</span></b></div>
    <div id="ramBox">RAM: checking...</div>
    <section id="bootCard" aria-label="AMINE PS4 boot screen">
      <div class="boot-kicker">PLAYSTATION 4 · FIRMWARE 14.00</div>
      <div class="boot-mark"><span class="boot-core"></span></div>
      <div class="boot-title">AMINE <span>PS4</span></div>
      <div class="boot-subtitle">SYSTEM INITIALIZATION</div>
      <div class="boot-track"><span></span></div>
      <div id="spin"></div>
      <div id="msg">Restart your console</div>
    </section>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <script type="module">
      import "./jb.js";
    </script>
  </body>
</html>
